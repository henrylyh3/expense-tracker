name: expense_tracker
description: A private, offline personal ledger with MYR reporting.
publish_to: none
version: 0.2.1+5

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  decimal: ^3.2.6
  intl: ^0.20.3
  uuid: ^4.6.0
  fl_chart: ^1.3.0
  file_picker: ^13.3.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
