name: Verify guest web page
on:
  push:
    paths:
      - 'guest-web/**'
      - '.github/workflows/guest-web.yml'
  pull_request:
    paths:
      - 'guest-web/**'
      - '.github/workflows/guest-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify encrypted guest relay
        working-directory: guest-web
        run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in guest-web/public/*.mjs; do node --check "$file"; done
